packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@stylexjs/stylex": ^0.19.0
  "@types/node": ^24
  typescript: ^7.0.2
  unplugin-stylex: ^0.6.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
