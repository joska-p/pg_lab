packages:
    - apps/*
    - packages/*
    - tools/*

catalogMode: prefer

catalog:
    '@stylexjs/stylex': ^0.19.1
    '@stylexjs/unplugin': ^0.19.1
    '@types/node': ^24.19.2
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    bingo: ^0.13.2
    jscpd: ^5.4.2
    knip: ^6.42.1
    lightningcss: ^1.33.0
    madge: ^8.0.0
    # @vitejs/plugin-react@6.1.2 declares `^0.152.0` as its peer range.
    oxc-transform-react: ^0.152.0
    playwright-core: ^1.64.1
    react: ^19.3.1
    react-dom: ^19.3.1
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
    zod: ^4.6.7
    zustand: ^5.0.16
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
allowBuilds:
    esbuild: true
minimumReleaseAgeExclude:
    - '@voidzero-dev/vite-plus-core@1.4.0'
    - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
    - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
    - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
    - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
    - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
    - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
    - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
    - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
    - vite-plus@1.4.0
