<!doctype html>
<html lang="fr" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pg_lab — Mosaic Maker</title>
        <link rel="stylesheet" href="../../ui/styles/tokens.css" />
        <link rel="stylesheet" href="../../ui/styles/reset.css" />
        <link rel="stylesheet" href="../../ui/styles/shell.css" />
        <link rel="stylesheet" href="../../ui/styles/controls.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <pg-shell class="pg-shell" data-background="auroral-fluid">
            <section
                class="pg-shell__stage pg-bg--auroral-fluid pg-mosaic-stage"
                aria-label="Mosaic Maker"
            >
                <div class="pg-intro">
                    <h1>Mosaic Maker</h1>
                    <p class="pg-lead">
                        Une mosaïque de tuiles SVG générée selon la place disponible. Les couleurs,
                        la taille et les rotations sont pilotées par des variables CSS.
                    </p>
                </div>

                <div class="pg-mosaic" data-mosaic aria-hidden="true"></div>
                <p class="pg-mosaic__status pg-status" data-status aria-live="polite">Prêt.</p>
            </section>

            <aside class="pg-shell__panel" aria-label="Contrôles">
                <button type="button" class="pg-shell__handle" aria-hidden="true" tabindex="-1">
                    ≶
                </button>
                <div class="pg-shell__content">
                    <h2>Contrôles</h2>

                    <h3>Formes de tuiles</h3>
                    <div
                        class="pg-mosaic__tile-set"
                        data-tile-set
                        role="group"
                        aria-label="Formes de tuiles"
                    >
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="CornerCircles"
                            aria-label="Cercles aux coins"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="CornerCircles"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="Diamond"
                            aria-label="Losange"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="Diamond"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="MiddleCircle"
                            aria-label="Cercle central"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="MiddleCircle"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="OppositeCircles"
                            aria-label="Cercles opposés"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="OppositeCircles"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="Rainbow"
                            aria-label="Arc-en-ciel"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="Rainbow"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="Square"
                            aria-label="Carré"
                            aria-pressed="true"
                        >
                            <span class="pg-mosaic__tile-preview" data-tile-preview="Square"></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="Triangles"
                            aria-label="Triangles"
                            aria-pressed="true"
                        >
                            <span
                                class="pg-mosaic__tile-preview"
                                data-tile-preview="Triangles"
                            ></span>
                        </button>
                        <button
                            type="button"
                            class="pg-mosaic__tile-button"
                            data-tile="Cube"
                            aria-label="Cube"
                            aria-pressed="true"
                        >
                            <span class="pg-mosaic__tile-preview" data-tile-preview="Cube"></span>
                        </button>
                    </div>

                    <h3>Actions</h3>
                    <div class="pg-mosaic__actions">
                        <button type="button" data-shuffle-colors>Mélanger les couleurs</button>
                        <button type="button" data-shuffle-rotations>Mélanger les rotations</button>
                        <button type="button" data-cycle-palettes>Palette suivante</button>
                        <button type="button" data-regenerate>Régénérer</button>
                    </div>

                    <h3>Disposition</h3>
                    <label class="pg-control">
                        <span>Taille des tuiles</span>
                        <span data-control="tile-size"></span>
                        <output data-value="tile-size">64 px</output>
                    </label>
                    <label class="pg-control">
                        <span>Espacement</span>
                        <span data-control="gap"></span>
                        <output data-value="gap">0 px</output>
                    </label>

                    <h3>Palettes</h3>
                    <div
                        class="pg-mosaic__palettes"
                        data-palettes
                        role="radiogroup"
                        aria-label="Palettes de couleurs"
                    ></div>
                    <p
                        class="pg-mosaic__palette-status pg-status"
                        data-palette-status
                        aria-live="polite"
                    >
                        Chargement des palettes…
                    </p>

                    <button type="button" data-theme-toggle>Thème</button>
                </div>
            </aside>
        </pg-shell>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
