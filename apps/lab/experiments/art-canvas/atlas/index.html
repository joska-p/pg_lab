<!doctype html>
<html lang="fr" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pg_lab — Art Canvas · Atlas</title>
        <link rel="stylesheet" href="../../../ui/styles/tokens.css" />
        <link rel="stylesheet" href="../../../ui/styles/reset.css" />
        <link rel="stylesheet" href="../../../ui/styles/shell.css" />
        <link rel="stylesheet" href="../../../ui/styles/controls.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <pg-shell class="pg-shell" data-background="auroral-fluid">
            <section class="pg-shell__stage pg-bg--auroral-fluid" aria-label="Atlas">
                <div class="pg-intro">
                    <h1>Atlas</h1>
                    <p class="pg-lead">
                        Une grille de glyphes inspirés des syllabaires canadiens, orientés par
                        Fibonacci modulo N.
                    </p>
                </div>

                <div class="pg-canvas-viewport">
                    <canvas class="pg-canvas" data-canvas aria-label="Rendu Atlas"></canvas>
                    <p class="pg-canvas__error" data-error role="alert" hidden></p>
                </div>

                <p class="pg-status pg-canvas__status" data-status aria-live="polite">
                    Initialisation…
                </p>
            </section>

            <aside class="pg-shell__panel" aria-label="Contrôles">
                <button type="button" class="pg-shell__handle" aria-hidden="true" tabindex="-1">
                    ≶
                </button>
                <div class="pg-shell__content">
                    <h2>Contrôles</h2>
                    <p><a href="../">← Sommaire Art Canvas</a></p>
                    <label class="pg-control pg-control--stacked">
                        <span>Graine</span>
                        <span data-control="seed"></span>
                    </label>
                    <button type="button" data-random-seed>Graine aléatoire</button>
                    <label class="pg-control">
                        <span>Modulo</span>
                        <span data-control="modulo"></span>
                    </label>
                    <label class="pg-control">
                        <span>Complexité</span>
                        <span data-control="complexity"></span>
                    </label>
                    <div class="pg-control pg-control--inline">
                        <span>Lecture</span>
                        <button type="button" data-play-toggle data-playing="true">Pause</button>
                    </div>
                    <button type="button" data-theme-toggle>Thème</button>
                </div>
            </aside>
        </pg-shell>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
