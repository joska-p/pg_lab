<!doctype html>
<html lang="fr" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pg_lab — Palette</title>
        <link rel="stylesheet" href="../../ui/styles/tokens.css" />
        <link rel="stylesheet" href="../../ui/styles/reset.css" />
        <link rel="stylesheet" href="../../ui/styles/shell.css" />
        <link rel="stylesheet" href="../../ui/styles/controls.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <pg-shell class="pg-shell" data-background="auroral-fluid">
            <section class="pg-shell__stage pg-bg--auroral-fluid" aria-label="Palette">
                <div class="pg-intro">
                    <h1>Palette</h1>
                    <p class="pg-lead">
                        La couleur pure tourne dans un worker ; le HTML reste statique et les
                        contrôles ne font qu'augmenter le panneau.
                    </p>
                </div>

                <div class="pg-palette__base">
                    <span class="pg-palette__base-label">Couleur de base</span>
                    <div
                        class="pg-palette__swatch pg-palette__swatch--base"
                        data-base-swatch
                        title=""
                    ></div>
                </div>

                <div class="pg-palette__result" data-palettes aria-live="polite"></div>
                <p class="pg-palette__status pg-status" data-status aria-live="polite">Prêt.</p>
            </section>

            <aside class="pg-shell__panel" aria-label="Contrôles">
                <button type="button" class="pg-shell__handle" aria-hidden="true" tabindex="-1">
                    ≶
                </button>
                <div class="pg-shell__content">
                    <h2>Contrôles</h2>

                    <label class="pg-control">
                        <span>Harmonie</span>
                        <span data-control="rule"></span>
                    </label>

                    <label class="pg-control">
                        <span>Luminosité (L)</span>
                        <span data-control="lightness"></span>
                        <output data-value="lightness"></output>
                    </label>

                    <label class="pg-control">
                        <span>Chroma (C)</span>
                        <span data-control="chroma"></span>
                        <output data-value="chroma"></output>
                    </label>

                    <label class="pg-control">
                        <span>Teinte (H)</span>
                        <span data-control="hue"></span>
                        <output data-value="hue"></output>
                    </label>

                    <label class="pg-control pg-control--inline">
                        <span>Génération automatique</span>
                        <span data-control="auto"></span>
                    </label>

                    <button type="button" data-generate>Générer</button>
                    <button type="button" data-clear>Effacer</button>
                    <button type="button" data-theme-toggle>Thème</button>
                </div>
            </aside>
        </pg-shell>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
